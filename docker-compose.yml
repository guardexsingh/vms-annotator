services:
  vms-annotator:
    build:
      context: .
      dockerfile: Dockerfile
    image: vms-annotator:gateway
    container_name: vms-annotator
    restart: unless-stopped
    ports:
      - "${ANNOTATOR_HOST_PORT:-18080}:18080"
    environment:
      ANNOTATOR_RUNTIME_MODE: gateway_only
      ANNOTATOR_ALLOWED_CAMERA_IDS: ${ANNOTATOR_ALLOWED_CAMERA_IDS:-cam_03}
      METADATA_TTL_MS: ${METADATA_TTL_MS:-2000}
      ANNOTATOR_INGEST_TOKEN: ${ANNOTATOR_INGEST_TOKEN:-}
      ANNOTATOR_EVIDENCE_JOURNAL_DIR: /data/evidence-journal
      ANNOTATOR_EVIDENCE_JOURNAL_RETENTION_HOURS: ${ANNOTATOR_EVIDENCE_JOURNAL_RETENTION_HOURS:-24}
      ANNOTATOR_EVIDENCE_JOURNAL_MAX_EVENTS: ${ANNOTATOR_EVIDENCE_JOURNAL_MAX_EVENTS:-1000}
      ANNOTATOR_EVIDENCE_JOURNAL_MAX_RECORDS_PER_EVENT: ${ANNOTATOR_EVIDENCE_JOURNAL_MAX_RECORDS_PER_EVENT:-5000}
      ANNOTATOR_EVIDENCE_JOURNAL_MAX_BYTES_PER_EVENT: ${ANNOTATOR_EVIDENCE_JOURNAL_MAX_BYTES_PER_EVENT:-5242880}
      ANNOTATOR_EVIDENCE_EXPORT_TOKEN: ${ANNOTATOR_EVIDENCE_EXPORT_TOKEN:-}
    volumes:
      - vms-annotator-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  vms-annotator-data:
