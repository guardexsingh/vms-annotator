# Independent Docker deployment: metadata only. This service never launches
# MediaMTX or creates a video/WHEP/RTSP output; the configured RTSP input is
# consumed only by the on-demand inference capture worker.
runtime:
  mode: ${ANNOTATOR_RUNTIME_MODE:-metadata_only}

cameras:
  - id: ${ANNOTATOR_CAMERA_ID:-cam_01}
    name: ${ANNOTATOR_CAMERA_NAME:-VMS Camera 01}
    url: ${ANNOTATOR_CAMERA_RTSP_URL}
    enabled: true
    rtsp_transport: tcp
    detection_enabled: true
    detection_source: camera

detection:
  enabled: true
  # TensorRT is explicit by default: startup fails if the mounted engine or
  # compatible CUDA/TensorRT runtime is unavailable; it never falls back to CPU.
  backend: ${DETECTION_BACKEND:-tensorrt}
  precision: ${DETECTION_PRECISION:-fp16}
  model: ${ANNOTATOR_MODEL_PATH:-models/yolo11n.pt}
  trt_engine_model: ${TRT_ENGINE_MODEL:-models/yolo11n_640_fp16.engine}
  image_size: 640
  confidence: ${DETECTION_CONFIDENCE:-0.40}
  classes: [0]
  target_fps_per_camera: ${YOLO_INFERENCE_FPS:-3}
  capture_fps: ${AI_CAPTURE_FPS:-3}
  capture_max_dimension: 640
  result_ttl_ms: 2000
  latest_frame_only: true
  allow_backend_fallback: false
  device: auto
  batch_mode: serial
  inference_workers: 1
  torch_threads: 1
  torch_interop_threads: 1
  max_frame_age_ms: 1500
  max_batch_wait_ms: 20

tracking:
  enabled: true
  tracker: bytetrack
  track_high_thresh: 0.50
  track_low_thresh: 0.10
  new_track_thresh: 0.50
  match_thresh: 0.80
  track_buffer: 2
  fuse_score: true
  hold_box_ms: 1500
  remove_track_ms: 2000
  prediction_fps: ${BYTETRACK_PREDICTION_FPS:-5}
  prediction_deadzone_norm: 0.002
  max_prediction_displacement_norm_per_second: 0.25

metadata:
  transport: websocket
  path: /ws/detections

pipeline:
  mode: native

video:
  mode: metadata_only
  allow_transcode_fallback: false

service:
  host: ${ANNOTATOR_BIND_HOST:-0.0.0.0}
  port: ${ANNOTATOR_PORT:-18080}
